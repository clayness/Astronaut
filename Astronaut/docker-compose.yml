services:
  spark-master:
    image: bitnami/spark:latest
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080" # Spark Master UI
      - "7077:7077" # Spark Master internal communication
    networks:
      - spark-network
    volumes:
      - ./src/main/resources/log4j2.properties:/opt/bitnami/spark/conf/log4j2.properties
      - ./target/scala-2.13/astronaut.jar:/opt/shared/astronaut.jar
      - ./out:/opt/shared

  spark-worker-1:
    image: bitnami/spark:latest
    container_name: spark-worker-1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=1 # Adjust cores as needed
      - SPARK_WORKER_MEMORY=1g # Adjust memory as needed
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    networks:
      - spark-network
    volumes:
      - ./src/main/resources/log4j2.properties:/opt/bitnami/spark/conf/log4j2.properties
      - ./target/scala-2.13/astronaut.jar:/opt/shared/astronaut.jar
      - ./out:/opt/shared

  spark-worker-2:
    image: bitnami/spark:latest
    container_name: spark-worker-2
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
