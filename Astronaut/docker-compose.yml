  mysql:
    image: bitnami/mysql:latest
    container_name: mysql-db
    environment:
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASS}
    ports:
      - "3306:3306"
    networks:
      - spark-network

networks:
  spark-network:
    driver: bridge
