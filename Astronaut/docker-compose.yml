      - SPARK_SSL_ENABLED=no
    depends_on:
      - spark-master
    ports:
      - "8082:8081"
    networks:
      - spark-network
    volumes:
      - ./src/main/resources/log4j2.properties:/opt/bitnami/spark/conf/log4j2.properties
      - ./target/scala-2.13/astronaut.jar:/opt/shared/astronaut.jar
      - ./out:/opt/shared

  spark-worker-3:
