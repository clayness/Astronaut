apiVersion: v1
kind: PersistentVolume
metadata:
  name: kkmltradeoff-file
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  azureFile:
    secretName: kkmltradeoff-secret
    shareName:  kkmltradeoffshare
  persistentVolumeReclaimPolicy: Retain
  storageClassName: azurefile-csi